<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOMUS OBSCURA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Cinzel', serif;
            color: #b8a8a8;
            line-height: 1.6;
            min-height: 100vh;
            background: #020101;
            overflow-x: hidden;
        }
        .fundo-imagem {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('') center / cover no-repeat;
            opacity: 0.06;
            z-index: -9;
        }
        .fundo {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 15%, rgba(45,8,15,0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 85%, rgba(35,6,12,0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(8,2,4,0.98) 0%, #000 70%),
                linear-gradient(180deg, #000 0%, #020101 50%, #000 100%);
            z-index: -8;
        }
        .sombra-etérea {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(60,15,25,0.05), transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(50,12,20,0.04), transparent 60%);
            z-index: -7; pointer-events: none;
        }
        .fogo-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -5; overflow: hidden;
        }
        .brasa {
            position: absolute; bottom: -10px; border-radius: 50%;
            background: radial-gradient(circle, #ff4444, #991a1a);
            box-shadow: 0 0 8px #ff3333, 0 0 16px #991a1a, 0 0 25px rgba(150,20,20,0.4);
            opacity: 0; animation: subirBrasa linear infinite; filter: blur(1px);
        }
        @keyframes subirBrasa {
            0%{transform:translateY(0)translateX(0)scale(1);opacity:0}
            10%{opacity:.85}
            100%{transform:translateY(-100vh)translateX(12px)scale(.4);opacity:0}
        }
        .labareda-base {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
            background: linear-gradient(to top, rgba(80,10,10,0.15), transparent 100%);
            z-index: -5; pointer-events: none; filter: blur(10px);
        }
        .conteudo { max-width: 1280px; margin: 0 auto; padding: 0 18px; position: relative; z-index: 1; }
        .menu-cabecalho {
            position: fixed; top: 0; left: 0; width: 100%;
            background: linear-gradient(to bottom, rgba(5,0,1,.95), rgba(8,1,3,.9));
            z-index: 100; padding: 12px 18px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(120,20,35,.25);
            backdrop-filter: blur(10px);
        }
        .logo-menu {
            font-family: 'Cinzel Decorative', serif; font-size: .85rem; letter-spacing: 3px;
            color: #ff2b2b;
            text-shadow: 0 0 8px #ff2b2b, 0 0 16px #cc1f1f, 0 0 24px rgba(200,30,30,0.5);
        }
        .botao-sanduiche {
            background: none; border: none; color: #ff4040;
            font-size: 1.5rem; cursor: pointer; padding: 5px;
            text-shadow: 0 0 6px #ff2b2b;
            transition: all .3s ease;
        }
        .botao-sanduiche:hover { 
            color: #ff6666; 
            text-shadow: 0 0 12px #ff4444, 0 0 24px #ff2b2b;
        }
        .menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,.97); z-index: 150;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 35px;
        }
        .menu-overlay.aberto { display: flex; }
        .menu-overlay a {
            color: #cc3333; text-decoration: none; font-size: 1.2rem; letter-spacing: 2px;
            padding: 15px 35px; border: 1px solid transparent;
            text-shadow: 0 0 6px rgba(200,50,50,0.3);
            transition: all .4s ease;
        }
        .menu-overlay a:hover {
            color: #ff4444; border-color: rgba(255,50,50,.35);
            text-shadow: 0 0 12px #ff2b2b, 0 0 25px rgba(255,43,43,0.5);
        }
        .menu-overlay a.ativo { 
            color: #ff2b2b; 
            text-shadow: 0 0 10px #ff2b2b, 0 0 20px rgba(255,43,43,0.4);
        }
        .fechar-menu {
            position: absolute; top: 20px; right: 20px;
            background: none; border: none; color: #882222;
            font-size: 1.8rem; cursor: pointer; transition: all .3s ease;
        }
        .fechar-menu:hover { color: #ff4444; text-shadow: 0 0 10px #ff2b2b; }
        .botao-carrinho {
            position: relative; background: none; border: none; color: #cc3333;
            font-size: 1.3rem; cursor: pointer; padding: 5px;
            text-shadow: 0 0 6px rgba(200,40,40,0.3);
            transition: all .3s ease;
        }
        .botao-carrinho:hover { color: #ff4444; text-shadow: 0 0 12px #ff2b2b; }
        .contador-carrinho {
            position: absolute; top: -5px; right: -5px;
            background: linear-gradient(135deg, #991a1a, #cc2222); 
            color: #fff; font-size: .7rem; font-weight: bold;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #ff3333;
            box-shadow: 0 0 8px #ff2b2b;
        }
        .modal-carrinho {
            position: fixed; top: 0; right: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,.95); z-index: 200; display: none;
            justify-content: flex-end;
        }
        .modal-carrinho.aberto { display: flex; }
        .carrinho-conteudo {
            width: 100%; max-width: 360px; height: 100%;
            background: linear-gradient(180deg, #0a0204, #030102);
            border-left: 1px solid rgba(120,25,40,.25);
            padding: 20px; overflow-y: auto; position: relative;
        }
        .fechar-carrinho {
            position: absolute; top: 15px; right: 15px;
            background: none; border: none; color: #882222; font-size: 1.5rem;
            cursor: pointer; transition: all .3s ease;
        }
        .fechar-carrinho:hover { color: #ff4444; text-shadow: 0 0 10px #ff2b2b; }
        .carrinho-titulo {
            font-family: 'Cinzel Decorative', serif; font-size: 1.2rem; letter-spacing: 2px;
            color: #ff2b2b; margin-bottom: 20px; text-align: center;
            text-shadow: 0 0 10px #ff2b2b, 0 0 20px rgba(255,43,43,0.4);
        }
        .item-carrinho {
            display: flex; gap: 10px; padding: 12px 0;
            border-bottom: 1px solid rgba(80,15,25,.2); align-items: center;
        }
        .item-img { width: 48px; height: 48px; object-fit: cover; border-radius: 2px; border: 1px solid rgba(100,20,30,.3); }
        .item-info { flex-grow: 1; }
        .item-nome { font-size: .88rem; color: #ff5555; margin-bottom: 2px; text-shadow: 0 0 4px rgba(255,60,60,0.2); }
        .item-preco { font-size: .82rem; color: #ff8844; text-shadow: 0 0 4px rgba(255,136,68,0.2); }
        .item-qtd { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
        .item-qtd button {
            width: 22px; height: 22px; border: none; background: rgba(80,15,25,.4);
            color: #ff7777; cursor: pointer; border-radius: 2px; transition: all .2s ease;
            border: 1px solid rgba(120,25,40,.2);
        }
        .item-qtd button:hover { background: rgba(120,25,40,.5); color: #ffaaaa; box-shadow: 0 0 6px rgba(255,60,60,0.3); }
        .item-qtd span { min-width: 20px; text-align: center; font-size: .9rem; color: #ff4444; }
        .remover-item {
            background: none; border: none; color: #662222; cursor: pointer; font-size: 1rem; margin-left: 5px;
            transition: color .2s ease;
        }
        .remover-item:hover { color: #ff4444; }
        .carrinho-total {
            margin-top: 20px; padding: 15px 0; border-top: 1px solid rgba(100,20,35,.25);
            text-align: right; font-size: 1.15rem; color: #ff8844;
        }
        .carrinho-vazio { text-align: center; padding: 40px 20px; color: #663333; font-style: italic; font-size: .9rem; }
        .botao-finalizar {
            width: 100%; margin-top: 20px; padding: 13px;
            background: linear-gradient(135deg, #7a1528, #b02233);
            color: #ffdddd; border: none; font-family: 'Cinzel', serif; font-size: .9rem; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all .3s ease;
            border: 1px solid rgba(200,40,60,.3);
        }
        .botao-finalizar:hover { 
            box-shadow: 0 0 15px #ff2b2b, 0 0 30px rgba(255,43,43,0.4); 
            background: linear-gradient(135deg, #991a2e, #cc283a);
            color: #ffffff;
        }
        .botao-finalizar:disabled { background: #221111; cursor: not-allowed; opacity: .5; border-color: #331111; }
        header {
            padding: 90px 15px 40px; text-align: center;
            border-bottom: 1px solid rgba(100,20,35,.2); margin-bottom: 40px;
        }
        .simbolo { font-size: 2.5rem; color: #ff2b2b; margin-bottom: 10px; 
            text-shadow: 0 0 10px #ff2b2b, 0 0 20px #cc1f1f, 0 0 35px rgba(200,30,30,0.4);
        }
        h1 {
            font-family: 'Cinzel Decorative', serif; font-size: clamp(1.8rem,6vw,3.2rem); letter-spacing: 5px;
            color: #ff2b2b; 
            text-shadow: 0 0 10px #ff2b2b, 0 0 20px #ff2b2b, 0 0 35px #cc1f1f, 0 0 50px rgba(200,30,30,0.3);
            margin-bottom: 5px;
        }
        .subtitulo { 
            color: #cc5555; font-size: .95rem; font-style: italic; letter-spacing: 3px;
            max-width: 500px; margin: 0 auto; line-height: 1.8;
            text-shadow: 0 0 6px rgba(200,60,60,0.2);
        }
        .grade-produtos {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap: 28px; padding-bottom: 60px;
        }
        .produto-card {
            background: linear-gradient(180deg, rgba(15,4,7,.9), rgba(5,1,3,.95));
            border: 1px solid rgba(90,18,30,.2); padding: 10px;
            position: relative; display: flex; flex-direction: column; height: 400px;
            transition: all .4s ease;
        }
        .produto-card:hover {
            transform: translateY(-5px); border-color: rgba(150,30,45,.35);
            box-shadow: 0 15px 30px rgba(0,0,0,.6), 0 0 20px rgba(120,25,40,.12), inset 0 0 15px rgba(60,10,20,.05);
        }
        .produto-card::before {
            content: ''; position: absolute; inset: 14px;
            border: 1px solid rgba(60,10,20,.15); pointer-events: none; transition: border-color .4s ease;
        }
        .produto-card:hover::before { border-color: rgba(120,25,40,.25); }
        .produto-foto {
            width: 100%; height: 200px; object-fit: cover; object-position: center;
            border: 1px solid rgba(80,15,28,.2); margin-bottom: 15px; transition: transform .5s ease;
            filter: brightness(.9);
        }
        .produto-card:hover .produto-foto { transform: scale(1.02); filter: brightness(1); }
        .produto-corpo { padding: 0 8px; flex-grow: 1; display: flex; flex-direction: column; }
        .produto-nome { 
            font-family: 'Cinzel Decorative', serif; font-size: 1rem; color: #ff4444; margin-bottom: 8px; letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,68,68,0.3);
        }
        .produto-desc { color: #996666; font-size: .84rem; line-height: 1.5; margin-bottom: 12px; flex-grow: 1; }
        .produto-preco { 
            font-size: 1.25rem; font-weight: 600; color: #ff8844; margin-bottom: 12px; letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255,136,68,0.3);
        }
        .botao-adicionar {
            width: 100%; padding: 10px;
            background: linear-gradient(135deg, #7a1528, #a81f30);
            color: #ffdddd; border: 1px solid rgba(180,35,55,.25);
            font-family: 'Cinzel', serif; font-size: .88rem; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all .3s ease;
        }
        .botao-adicionar:hover { 
            background: linear-gradient(135deg, #991a2e, #cc283a); 
            box-shadow: 0 0 10px #ff2b2b, 0 0 20px rgba(255,43,43,0.3);
            color: #ffffff;
        }
        .vazio { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #663333; font-style: italic; }
        .vazio .simbolo-grande { font-size: 2.5rem; color: #ff2b2b; margin-bottom: 15px;
            text-shadow: 0 0 10px #ff2b2b, 0 0 25px rgba(255,43,43,0.3);
        }
        .carregando { text-align: center; padding: 40px; color: #996666; font-style: italic; }
        @media(min-width:768px) { .grade-produtos{grid-template-columns:repeat(3,1fr);gap:30px} }
        @media(min-width:1024px) { .grade-produtos{grid-template-columns:repeat(4,1fr);gap:32px} }
    </style>
</head>
<body>
    <div class="fundo-imagem"></div>
    <div class="fundo"></div>
    <div class="sombra-etérea"></div>
    <div class="labareda-base"></div>
    <div class="fogo-container" id="containerFogo"></div>
    <nav class="menu-cabecalho">
        <button class="botao-sanduiche" id="botaoSanduiche">☰</button>
        <span class="logo-menu">DOMUS OBSCURA</span>
        <button class="botao-carrinho" id="botaoCarrinho">🛒 <span class="contador-carrinho" id="contadorCarrinho">0</span></button>
    </nav>
    <div class="menu-overlay" id="menuOverlay">
        <button class="fechar-menu" id="fecharMenu">✕</button>
        <a href="index.html">🏠 Início</a>
        <a href="loja.html" class="ativo">🕯️ Produtos</a>
        <a href="#" id="linkCarrinho">🛒 Meu Carrinho</a>
    </div>
    <div class="modal-carrinho" id="modalCarrinho">
        <div class="carrinho-conteudo">
            <button class="fechar-carrinho" id="fecharCarrinho">✕</button>
            <h3 class="carrinho-titulo">🛒 Meu Carrinho</h3>
            <div id="listaCarrinho"></div>
            <div class="carrinho-total" id="areaTotal" style="display:none;">
                Total: <span id="valorTotal">R$ 0,00</span>
            </div>
            <button class="botao-finalizar" id="botaoFinalizar" disabled>📦 Enviar Pedido</button>
        </div>
    </div>
    <header>
        <div class="simbolo">☽ ✧ ☾</div>
        <h1>DOMUS OBSCURA</h1>
        <p class="subtitulo">Onde o mistério encontra a essência</p>
    </header>
    <main class="conteudo">
        <div class="grade-produtos" id="gradeProdutos">
            <p class="carregando">Carregando produtos...</p>
        </div>
    </main>
    <script>
        const WHATSAPP = '5531987276275';
        const CHAVE_CARRINHO = 'carrinho_domus_obscura';
        let listaProdutos = [];

        // ✅ FUNÇÃO MÁGICA — FUNCIONA COM OU SEM O PONTO! NÃO IMPORTA!
        function ajustarCaminhoImagem(caminho) {
            if (!caminho) return '';
            if (caminho.startsWith('./')) return caminho;        // ✅ COM PONTO → FICA IGUAL
            if (caminho.startsWith('imagens/')) return './' + caminho; // ✅ SEM PONTO → ADICIONA!
            return caminho;
        }

        function criarBrasas() {
            const container = document.getElementById('containerFogo');
            for(let i = 0; i < 40; i++){
                const b = document.createElement('div');
                b.className = 'brasa';
                const tam = Math.random() * 10 + 4;
                b.style.width = b.style.height = tam + 'px';
                b.style.left = Math.random() * 100 + '%';
                b.style.animationDuration = (Math.random() * 4 + 5) + 's';
                b.style.animationDelay = Math.random() * 4 + 's';
                container.appendChild(b);
            }
        }

        const menuOverlay = document.getElementById('menuOverlay');
        function abrirMenu(){ menuOverlay.classList.add('aberto'); }
        function fecharMenuFn(){ menuOverlay.classList.remove('aberto'); }
        document.getElementById('botaoSanduiche').onclick = abrirMenu;
        document.getElementById('fecharMenu').onclick = fecharMenuFn;
        document.getElementById('linkCarrinho').onclick = ()=>{ fecharMenuFn(); abrirCarrinho(); return false; };

        async function carregarProdutos() {
            try {
                const resposta = await fetch('./dados/produtos.json');
                if (!resposta.ok) throw new Error('Arquivo não encontrado');
                listaProdutos = await resposta.json();
                renderizarProdutos();
            } catch (erro) {
                try {
                    const resposta2 = await fetch('dados/produtos.json');
                    if (!resposta2.ok) throw new Error('Arquivo não encontrado');
                    listaProdutos = await resposta2.json();
                    renderizarProdutos();
                } catch (erro2) {
                    document.getElementById('gradeProdutos').innerHTML = `
                        <div class="vazio">
                            <p class="simbolo-grande">🕯️</p>
                            <p>Ainda não há produtos cadastrados.</p>
                            <p style="margin-top:10px;font-size:.85rem;color:#775555;">Use o Painel para cadastrar e publique o arquivo dados/produtos.json</p>
                        </div>`;
                }
            }
        }

        function renderizarProdutos() {
            const grade = document.getElementById('gradeProdutos');
            if (!listaProdutos.length) {
                grade.innerHTML = `<div class="vazio"><p class="simbolo-grande">🕯️</p><p>Nenhum produto disponível.</p></div>`;
                return;
            }
            grade.innerHTML = '';
            listaProdutos.forEach(prod => {
                const caminhoFoto = ajustarCaminhoImagem(prod.foto); // ✅ AJUSTA SOZINHO!
                const card = document.createElement('div');
                card.className = 'produto-card';
                card.innerHTML = `
                    <img src="${caminhoFoto}" alt="${prod.titulo}" class="produto-foto"
                         onerror="this.src='${caminhoFoto.replace('./', '')}'">
                    <div class="produto-corpo">
                        <h3 class="produto-nome">${prod.titulo}</h3>
                        <p class="produto-desc">${prod.descricao}</p>
                        <p class="produto-preco">R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
                        <button class="botao-adicionar" data-id="${prod.id}">🛒 Adicionar</button>
                    </div>`;
                grade.appendChild(card);
            });
            document.querySelectorAll('.botao-adicionar').forEach(btn => {
                btn.onclick = () => {
                    const prod = listaProdutos.find(p => p.id == btn.dataset.id);
                    if (prod) adicionarAoCarrinho(prod);
                };
            });
        }

        function pegarCarrinho(){ return JSON.parse(localStorage.getItem(CHAVE_CARRINHO) || '[]'); }
        function salvarCarrinho(carrinho){ localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho)); }
        function adicionarAoCarrinho(produto){
            const carrinho = pegarCarrinho();
            const existe = carrinho.find(i => i.id === produto.id);
            existe ? existe.qtd++ : carrinho.push({...produto, qtd: 1});
            salvarCarrinho(carrinho);
            atualizarCarrinho(); abrirCarrinho();
        }
        function alterarQtd(id, delta){
            const carrinho = pegarCarrinho();
            const item = carrinho.find(i => i.id == id);
            if(item){ item.qtd += delta; if(item.qtd <= 0) carrinho.splice(carrinho.indexOf(item), 1); }
            salvarCarrinho(carrinho); atualizarCarrinho();
        }
        function removerDoCarrinho(id){ salvarCarrinho(pegarCarrinho().filter(i => i.id != id)); atualizarCarrinho(); }
        function calcularTotal(){ return pegarCarrinho().reduce((s, i) => s + i.preco * i.qtd, 0); }
        function atualizarContador(){ document.getElementById('contadorCarrinho').textContent = pegarCarrinho().reduce((s, i) => s + i.qtd, 0); }
        function atualizarCarrinho(){
            const carrinho = pegarCarrinho();
            const lista = document.getElementById('listaCarrinho');
            atualizarContador();
            if(!carrinho.length){
                lista.innerHTML = '<p class="carrinho-vazio">Aguardando seus tesouros...</p>';
                document.getElementById('areaTotal').style.display = 'none';
                document.getElementById('botaoFinalizar').disabled = true;
                return;
            }
            lista.innerHTML = '';
            carrinho.forEach(item => {
                const caminhoItemImg = ajustarCaminhoImagem(item.foto); // ✅ TAMBÉM NO CARRINHO!
                const el = document.createElement('div');
                el.className = 'item-carrinho';
                el.innerHTML = `<img src="${caminhoItemImg}" class="item-img" onerror="this.src='${caminhoItemImg.replace('./', '')}'"><div class="item-info"><h4 class="item-nome">${item.titulo}</h4><p class="item-preco">R$ ${item.preco.toFixed(2).replace('.', ',')}</p><div class="item-qtd"><button onclick="alterarQtd(${item.id}, -1)">−</button><span>${item.qtd}</span><button onclick="alterarQtd(${item.id}, 1)">+</button></div></div><button class="remover-item" onclick="removerDoCarrinho(${item.id})">🗑️</button>`;
                lista.appendChild(el);
            });
            document.getElementById('valorTotal').textContent = 'R$ ' + calcularTotal().toFixed(2).replace('.', ',');
            document.getElementById('areaTotal').style.display = 'block';
            document.getElementById('botaoFinalizar').disabled = false;
        }
        function abrirCarrinho(){ document.getElementById('modalCarrinho').classList.add('aberto'); }
        function fecharCarrinhoFn(){ document.getElementById('modalCarrinho').classList.remove('aberto'); }
        document.getElementById('botaoCarrinho').onclick = abrirCarrinho;
        document.getElementById('fecharCarrinho').onclick = fecharCarrinhoFn;
        document.getElementById('botaoFinalizar').onclick = () => {
            const carrinho = pegarCarrinho();
            if (!carrinho.length) return;
            let mensagem = 'PEDIDO DOMUS OBSCURA%0A%0A';
            carrinho.forEach(i => mensagem += `• ${i.titulo} — ${i.qtd}x — R$ ${(i.preco*i.qtd).toFixed(2).replace('.', ',')}%0A`);
            mensagem += `%0ATOTAL: R$ ${calcularTotal().toFixed(2).replace('.', ',')}`;
            window.open(`https://wa.me/${WHATSAPP}?text=${mensagem}`, '_blank');
        };
