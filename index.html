<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Poder e Magia na Quimbanda — Bruxa de Mulambo</title>
    <meta name="description" content="Verdadeira Quimbanda — Trabalhos espirituais com força e resultados reais.">
    <meta name="keywords" content="Quimbanda, Exu, Pombagira, rituais, magia, poder, trabalhos espirituais, Bruxa de Mulambo">
    <meta name="author" content="Bruxa de Mulambo">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --vermelho: #ff3030;
            --vermelho-escuro: #901010;
            --fundo: #0c0404;
            --texto: #e0c8c8;
            --texto-claro: #b07070;
            --borda: rgba(150, 30, 30, 0.25);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Cinzel', serif;
            background: var(--fundo);
            color: var(--texto);
            line-height: 1.75;
            position: relative;
        }

        /* ✅ BRASAS — INTACTO */
        .fogo-global {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }
        .brasa {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff4444, #991a1a);
            box-shadow: 0 0 8px #ff3333, 0 0 16px #991a1a, 0 0 25px rgba(150,20,20,0.4);
            opacity: 0;
            animation: subirBrasa linear infinite;
            filter: blur(1px);
        }
        @keyframes subirBrasa {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.85; }
            100% { transform: translateY(-100vh) translateX(12px) scale(0.4); opacity: 0; }
        }

        /* ✅ MENU — SEM LINHA EMBAIXO */
        .menu-topo {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 999;
        }
        .botao-sanduiche {
            width: 32px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            border: none;
            background: transparent;
            outline: none;
            box-shadow: none;
            padding: 0;
            margin: 0;
        }
        .botao-sanduiche span {
            width: 100%;
            height: 2px;
            background: var(--vermelho);
            box-shadow: none;
            border: none;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }
        .botao-sanduiche.aberto span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        .botao-sanduiche.aberto span:nth-child(2) { opacity: 0; }
        .botao-sanduiche.aberto span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

        .menu-suspenso {
            position: fixed,
            top: 48px;
            right: 20px;
            background: rgba(5, 0, 0, 0.98);
            border: 1px solid var(--borda);
            border-radius: 8px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
            z-index: 998;
        }
        .menu-suspenso.aberto {
            max-height: 400px;
            padding: 15px 0;
        }
        .menu-suspenso a {
            display: block;
            padding: 12px 25px;
            color: #b89090;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-suspenso a:hover {
            color: var(--vermelho);
            background: rgba(150, 30, 30, 0.1);
        }
        .menu-suspenso .loja-link {
            color: var(--vermelho);
            font-weight: 600;
        }

        /* ✅ CAPA */
        .capa-container {
            width: 100%;
            height: 70vh;
            min-height: 400px;
            overflow: hidden;
            position:
            z-index: 10;
        }
        .capa-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            filter: brightness(1.15) contrast(1.05) saturate(1.35);
            transform: none;
        }
        .capa-sombra {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(10, 2, 2, 0.20), rgba(10, 2, 2, 0.60));
            pointer-events: none;
        }
        .brilho-capa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(255, 60, 60, 0.08), transparent 60%);
            pointer-events: none;
            animation: brilhoPulsar 4s ease-in-out infinite alternate;
        }
        @keyframes brilhoPulsar {
            0% { opacity: 0.5; }
            100% { opacity: 0.8; }
        }

        .intro {
            text-align: 0
            padding: 40px 20px 60px;
            position: relative;
            z-index: 20;
        }
        .intro h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            color: var(--vermelho);
            text-shadow: 0 0 20px rgba(255, 40, 40, 0.6), 0 0 40px rgba(255, 40, 40, 0.3);
            margin-bottom: 12px;
            line-height: 1.2;
        }
        .intro p {
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: var(--texto-claro);
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--vermelho-escuro), #b81818);
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            text-decoration: none;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 60, 60, 0.4);
            border-radius: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 40, 40, 0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #b01818, #d82828);
            box-shadow: 0 0 15px rgba(255, 40, 40, 0.35);
        }

        section {
            padding: 50px 20;
            text-align: center;
            position: relative;
            z-index: 20;
        }
        section h2 {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.4rem, 5vw, 2rem);
            color: var(--vermelho);
            margin-bottom: 35px;
            text-shadow: 0 0 12px rgba(255, 40, 40, 0.3);
        }

        /* ✅ ================================================= */
        /* ✅ MOLDURA DE PORTAL RITUALÍSTICA NOS CARDS */
        /* ✅ ================================================= */
        .rituals-grade {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .ritual-card {
            width: 31%;
            background: linear-gradient(180deg, rgba(25, 8, 8, 0.95), rgba(10, 2, 2, 0.98));
            border: none;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
            transform: scale(1);

            box-shadow:
                inset 0 0 0 1px rgba(255, 40, 40, 0.18),
                inset 0 0 18px rgba(0, 0, 0, 0.9),
                0 0 8px rgba(0, 0, 0, 0.9),
                0 0 18px rgba(90, 10, 10, 0.35),
                0 0 30px rgba(40, 5, 5, 0.25);
        }

        /* ✅ Moldura externa ornamentada — escura e grossa */
        .ritual-card::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 3px solid transparent;
            border-image: linear-gradient(
                45deg,
                #1a1a1a,
                #3a2a1a,
                #1a1a1a,
                #2b1b1b
            ) 1;
            pointer-events: none;
            z-index: 2;
            border-radius: 6px;
            box-shadow:
                inset 0 0 12px rgba(0, 0, 0, 0.8),
                0 0 8px rgba(0, 0, 0, 0.9);
        }

        /* ✅ Moldura interna — brilho vermelho de sangue */
        .ritual-card::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(180, 20, 20, 0.75);
            pointer-events: none;
            z-index: 3;
            border-radius: 4px;
            filter: drop-shadow(0 0 8px rgba(255, 40, 40, 0.45));
        }

        /* ✅ Cantos ornamentados como na moldura da referência */
        .ritual-card .foto-trabalho::before,
        .ritual-card .foto-trabalho::after,
        .ritual-card .card-conteudo::before,
        .ritual-card .card-conteudo::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(80, 60, 20, 0.9);
            pointer-events: none;
            z-index: 4;
            opacity: 0.85;
        }

        /* ✅ Canto superior esquerdo */
        .ritual-card .foto-trabalho::before {
            top: 8px;
            left: 8px;
            border-right: none;
            border-bottom: none;
        }

        /* ✅ Canto superior direito */
        .ritual-card .foto-trabalho::after {
            top: 8px;
            right: 8px;
            border-left: none;
            border-bottom: none;
        }

        /* ✅ Canto inferior esquerdo */
        .ritual-card .card-conteudo::before {
            bottom: 8px;
            left: 8px;
            border-right: none;
            border-top: none;
        }

        /* ✅ Canto inferior direito */
        .ritual-card .card-conteudo::after {
            bottom: 8px;
            right: 8px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="fogo-global" id="fogoGlobal"></div>

    <div class="tela-cheia-fundo" id="telaCheia" onclick="fecharImagem()">
        <img src="" alt="" class="tela-cheia-img" id="imgTelaCheia">
    </point>
</body>
</html>
