        :root {
            --vermelho: #ff2222;

            --fundo-card: rgba(15, 5, 5, 0.95);

            --borda-vermelha: rgba(200, 40, 40, 0.6);

            box-sizing: border-box;

            background-attachment: fixed;

        /* ===== MENU ===== */
        .menu-topo {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 9999;
        }
        .botao-sanduiche {
            width: 32px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .botao-sanduiche span {
            width: 100%;
            height: 2px;
            background: var(--vermelho);
            box-shadow: 0 0 8px var(--vermelho);
        }
        .botao-sanduiche.aberto span:nth-child(1) { transform: rotate(45deg) translate(7px, 7px); }
        .botao-sanduiche.aberto span:nth-child(2) { opacity: 0; }
        .botao-sanduiche.aberto span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }
        .menu-suspenso {
            position: fixed;
            top: 55px;
            right: 20px;
            background: rgba(5, 0, 0, 0.98);
            border: 1px solid var(--borda-vermelha);
            border-radius: 8px;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            z-index: 9998;
        }
        .menu-suspenso.aberto {
            max-height: 500px;
            padding: 15px 0;
        }
        .menu-suspenso a {
            display: block;
            padding: 12px 25px;
            color: #b89090;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
        }
        .menu-suspenso a:hover { color: var(--vermelho); background: rgba(150, 30, 30, 0.1); }
        .menu-suspenso .loja-link { color: var(--vermelho); font-weight: bold; }

        /* ✅ CAPA — NÃO DEFORMA MAIS! ✅ */

            width: 100%;
            height: 70vh;
            min-height: 420px;
            max-height: 720px;
            position: relative;
            overflow: hidden;
            background: #000;
        }
        .capa-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
        }
        .capa-sombra {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(12,4,4,0.75) 80%);
        }
        .capa-texto {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 800px;
        }
        .capa-texto h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(2rem, 8vw, 4rem);
            color: var(--vermelho);
            text-shadow: 0 0 30px rgba(255, 40, 40, 0.6), 0 0 60px rgba(255, 40, 40, 0.3);
            margin-bottom: 15px;
        }
        .capa-texto p {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: var(--texto);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .btn-principal {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, var(--vermelho-escuro), var(--vermelho));
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid var(--borda-vermelha);
            box-shadow: 0 0 15px rgba(255, 40, 40, 0.3);
            transition: all 0.3s ease;
        }
        .btn-principal:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 40, 40, 0.5);
        }

            text-shadow: 0 0 15px rgba(255, 40, 40, 0.4);
        }
